{% extends "base_with_sidebar.html" %}
{% load static %}

{% block extra_js %}
{% endblock %}

{% block content %}

    <div class="container has-text-centered">
        <h1 class="title">Validate Certificate</h1>
        <h4 class="subtitle">Enter the certificate ID, verification code, or link from the certificate:</h4>
    </div>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var input = document.getElementById('InputID');
            var uuidPattern = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

            function search() {
                var query = input.value.trim();
                if (!query) {
                    return;
                }
                // A pasted link or code contains the uuid; use just that part.
                var match = query.match(uuidPattern);
                var key = match ? match[0].toLowerCase() : query;
                location.href = '/en/certificate/' + encodeURIComponent(key) + '/';
            }

            document.getElementById('submit-button').addEventListener('click', search);
            input.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    search();
                }
            });
        });
    </script>

    <div class="container has-text-centered">
        <div class="field">
            <div class="control">
                <input class="input is-medium" type="text" id="InputID" value="" autofocus/>
            </div>
        </div>
        <div class="field">
            <div class="control">
                <button class="button is-success is-medium" id="submit-button">
                    <span class="icon is-small">
                        <i class="fas fa-search"></i>
                    </span>
                    <span>Search</span>
                </button>
            </div>
        </div>
    </div>

{% endblock %}
