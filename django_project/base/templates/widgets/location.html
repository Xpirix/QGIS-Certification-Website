{% load static %}
<div class="map-container map-container--location"
     data-map="location"
     data-map-data="{{ map_data_id }}"
     data-default-logo="{% static 'images/logosign.svg' %}"
     role="region"
     aria-label="Training centre location">
  <p class="map-status" role="status">Loading the map</p>
  <div class="map-flat-view"></div>
</div>
<input type="hidden" id="{{ id }}" name="{{ name }}" value="{{ serialized }}">
<button type="button"
        class="button is-small is-light mt-3{% if not serialized %} is-hidden{% endif %}"
        data-map-clear="{{ id }}">
  <span class="icon"><i class="fas fa-times" aria-hidden="true"></i></span>
  <span>Remove location</span>
</button>
{{ map_data|json_script:map_data_id }}
